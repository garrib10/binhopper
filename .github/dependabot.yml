# Dependabot: weekly pull requests to keep dependencies up to date.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# Updates target develop, so they ship through staging like any other change.

version: 2
updates:
  # Backend: Python packages in backend/pyproject.toml
  - package-ecosystem: "pip"
    directory: "/backend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  # Frontend: npm packages in frontend/package.json
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # A package joins the first group it matches, so the React and Vite groups come
    # first. They cover every update type (majors too), because these packages'
    # versions must move together.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions versions used in .github/workflows/ci.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
