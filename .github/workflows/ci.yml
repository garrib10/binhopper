name: CI

# Runs on every pull request and on pushes to the three long-lived branches.
on:
  push:
    branches: [develop, staging, main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the code (CodeQL alert #3).
permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Test deployment verifier
        run: python -m unittest discover -s ../.github/scripts -p 'test_*.py'

  # The same pytest suite against real MySQL 8.4, after migrating an empty database.
  # Catches what SQLite hides (column precision, upsert syntax, collation) and fails
  # if a migration is broken (upgrade) or missing (check).
  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: binhopper_test
          MYSQL_USER: binhopper
          MYSQL_PASSWORD: binhopper
          MYSQL_ROOT_PASSWORD: binhopper-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: mysql+pymysql://binhopper:binhopper@127.0.0.1:3306/binhopper_test
      TEST_DATABASE_URL: mysql+pymysql://binhopper:binhopper@127.0.0.1:3306/binhopper_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  # The same mocked E2E suite in Safari's engine (WebKit: many users are on iPhones) and
  # Firefox, at 390 px and 1440 px (#72). Separate from `e2e`, so the required check's
  # name doesn't change; add `e2e-browsers (webkit)` / `(firefox)` to the ruleset once green.
  e2e-browsers:
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=mobile-${{ matrix.browser }} --project=desktop-${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: frontend/playwright-report

  # Visual regression (#73): screenshots of key screens in light and dark at 390 and 1440 px,
  # compared with frontend/visual/__screenshots__. Runs in the official Playwright image so
  # fonts and rendering match the baselines (made with `npm run visual:update`, same image).
  # Keep the image tag equal to the installed @playwright/test version.
  visual:
    runs-on: ubuntu-latest
    needs: frontend
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npx playwright test -c playwright.visual.config.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-diffs
          path: frontend/test-results

  # Full stack, nothing mocked: the built frontend against the real API and a migrated,
  # seeded MySQL, in Playwright at 390 px and 1440 px.
  system:
    runs-on: ubuntu-latest
    needs: frontend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: binhopper
          MYSQL_USER: binhopper
          MYSQL_PASSWORD: binhopper
          MYSQL_ROOT_PASSWORD: binhopper-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: mysql+pymysql://binhopper:binhopper@127.0.0.1:3306/binhopper
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Migrate and seed the database
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          alembic upgrade head
          python -m scripts.seed_sample
          python -m scripts.load_zip_codes tests/fixtures/gazetteer_zcta_sample.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e:system
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-system-report
          path: frontend/playwright-report
