name: Dependency review

# Blocks a PR that adds or upgrades a dependency with a known high or critical
# vulnerability. Make "dependency-review" a required check on develop
# (see docs/BRANCHING.md).
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # post the summary comment when the check fails

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
