name: Deploy
run-name: Deploy ${{ github.event.workflow_run.head_branch || github.ref_name }}@${{ github.event.workflow_run.head_sha || github.sha }}

# staging branch → "staging" environment; main → "production" environment.
# Hosting providers auto-deploy; this workflow verifies the deployed commit.
# Run after CI, not on push: Railway Wait for CI must not wait for a workflow
# that itself waits for Railway. workflow_run's own SHA/ref are the default branch;
# always use the triggering CI run's branch/SHA for environment and verification.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.head_branch == 'staging' || github.event.workflow_run.head_branch == 'main')) ||
      (github.event_name == 'workflow_dispatch' && (github.ref_name == 'staging' || github.ref_name == 'main'))
    runs-on: ubuntu-latest
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || 'staging' }}
    steps:
      - name: Check out trusted staging branch
        if: (github.event.workflow_run.head_branch || github.ref_name) == 'staging'
        uses: actions/checkout@v7
        with:
          ref: refs/heads/staging
          persist-credentials: false
      - name: Check out trusted production branch
        if: (github.event.workflow_run.head_branch || github.ref_name) == 'main'
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Require the CI-verified promotion commit
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || {
            echo 'The release branch moved since CI; use the newer promotion run.'
            exit 1
          }

      - name: Build frontend
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci && npm run build
        working-directory: frontend

      - name: Check backend installs and imports
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install . && python -c "import app.main"
        working-directory: backend

      - name: Test deployment verifier
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      # Waits for the promoted commit at API_URL, then at APP_URL/api/health through
      # Vercel's /api proxy, then checks the frontend. Pre-launch, production has no
      # API_URL/APP_URL yet, so the script skips with a notice instead of failing.
      - name: Verify deployed API, the app's /api proxy and frontend
        timeout-minutes: 11
        env:
          API_URL: ${{ vars.API_URL }}
          APP_URL: ${{ vars.APP_URL }}
          # Vercel Protection Bypass for Automation (environment secret); sent to APP_URL only.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python .github/scripts/check_deploy.py
