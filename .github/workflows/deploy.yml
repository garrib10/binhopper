name: Deploy

# staging branch → "staging" environment; main → "production" environment.
# Hosting providers auto-deploy; this workflow verifies the deployed commit.

on:
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'staging' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v7

      - name: Build frontend
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci && npm run build
        working-directory: frontend

      - name: Check backend installs and imports
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install . && python -c "import app.main"
        working-directory: backend

      - name: Test deployment verifier
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Verify deployed API commit and frontend
        timeout-minutes: 11
        env:
          API_URL: ${{ vars.API_URL }}
          APP_URL: ${{ vars.APP_URL }}
          GITHUB_SHA: ${{ github.sha }}
        run: python .github/scripts/check_deploy.py
