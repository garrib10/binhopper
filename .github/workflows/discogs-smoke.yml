name: Discogs smoke test

# The one place that calls the real Discogs API (#69): two read-only GETs each night, run
# through the worker's own queue and parser (backend/scripts/discogs_smoke.py). Never on
# pull requests. A failure here means Discogs changed something or the token stopped working.
on:
  schedule:
    - cron: "23 8 * * *"  # 08:23 UTC, ~4 am US Eastern
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discogs-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e .
      - name: Two read-only Discogs calls
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}  # repository secret; never echoed
        run: python -m scripts.discogs_smoke
