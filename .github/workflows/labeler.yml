name: Labeler

# Labels each pull request by the files it changes and its branch name.
# Rules live in .github/labeler.yml.
#
# Uses pull_request_target so it can also label Dependabot PRs (their normal
# pull_request token is read-only). That is safe here because this job never
# checks out or runs code from the pull request; it only reads the file list.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v6
        with:
          sync-labels: true   # drop a label from this list again if a later push no longer matches it
