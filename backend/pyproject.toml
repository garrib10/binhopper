[project]
name = "binhopper-api"
version = "0.1.0"
description = "API for Binhopper: catalog, nearby stock, wishlist, collection."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<2.2",
    "pymysql>=1.1",
    "cryptography>=42",
    "alembic>=1.13",
    "apscheduler>=3.11,<4",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
shops = ["osmium>=4,<5"]
dev = [
    "osmium>=4,<5",
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned so a new ruff release can't silently change what CI checks.
# E/F: errors and undefined names; B: likely bugs; DTZ: timezone mistakes.
select = ["E4", "E7", "E9", "F", "B", "DTZ"]
