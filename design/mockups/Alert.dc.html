<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Price and distance alert</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#B83A17}a:hover{color:#8F2C10}
button,input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3EFE6; color: #1B1814; font-family: Inter, system-ui, sans-serif; overflow: hidden">
<header style="flex: none; display: flex; align-items: center; gap: 4px; padding: 12px 12px 4px">
<a href="Wishlist.dc.html" aria-label="Back to wishlist" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1B1814"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
<span style="font-size: 14px; font-weight: 600">Wishlist</span>
</header>
<main style="flex: 1; overflow-y: auto; padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; gap: 14px; align-items: center">
<div style="flex: none; width: 64px; height: 64px; border-radius: 6px; background: #5B7FA6; position: relative; overflow: hidden">
<div style="position: absolute; right: -20px; top: 8px; width: 48px; height: 48px; border-radius: 50%; background: #1B1814; display: flex; align-items: center; justify-content: center"><div style="width: 16px; height: 16px; border-radius: 50%; background: #E2B13C"></div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 75%; font-size: 30px; line-height: 1; text-transform: uppercase">Alert me</h1>
<div style="font-size: 14px; font-weight: 600">Blue · Joni Mitchell</div>
</div>
</div>
<div style="padding: 14px 16px; border-radius: 14px; background: #1B1814; color: #F3EFE6; font-size: 15px; line-height: 1.5">Tell me when <strong>Blue</strong> is in stock within <strong style="color: #E2B13C">{{radiusText}}</strong> of 10011 for <strong style="color: #E2B13C">under ${{price}}</strong>, in <strong style="color: #E2B13C">{{condText}}</strong>.</div>
<section aria-labelledby="price-h" style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 id="price-h" style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B645A">Max price</h2>
<span style="font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 85%; font-size: 24px">${{price}}</span>
</div>
<div role="group" aria-label="Max price" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{prices}}" as="p" hint-placeholder-count="5">
<button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="min-height: 44px; border-radius: 10px; border: 1px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-size: 14px; font-weight: 700; cursor: pointer">${{p.label}}</button>
</sc-for>
</div>
</section>
<section aria-labelledby="rad-h" style="display: flex; flex-direction: column; gap: 8px">
<h2 id="rad-h" style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B645A">Distance</h2>
<div role="group" aria-label="Distance" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #E5DECF">
<sc-for list="{{radii}}" as="r" hint-placeholder-count="5">
<button type="button" aria-pressed="{{r.pressed}}" onClick="{{r.pick}}" style="min-height: 44px; border: 0; border-radius: 9px; background: {{r.bg}}; color: {{r.fg}}; font-size: 13px; font-weight: 700; cursor: pointer">{{r.label}}</button>
</sc-for>
</div>
</section>
<section aria-labelledby="cond-h" style="display: flex; flex-direction: column; gap: 8px">
<h2 id="cond-h" style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B645A">Minimum condition</h2>
<div role="group" aria-label="Minimum condition" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{conds}}" as="c" hint-placeholder-count="4">
<button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 44px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13px; font-weight: 700; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
</section>
<section aria-labelledby="also-h" style="display: flex; flex-direction: column; gap: 8px">
<h2 id="also-h" style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B645A">Also watch</h2>
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 12px; background: #FFFDF8; border: 1px solid #E5DECF">
<input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #1B1814">
<span style="flex: 1; font-size: 14px; font-weight: 600">Online sellers and resellers</span>
</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 12px; background: #FFFDF8; border: 1px solid #E5DECF">
<input type="checkbox" style="width: 20px; height: 20px; accent-color: #1B1814">
<span style="flex: 1; font-size: 14px; font-weight: 600">Only the original pressing</span>
</label>
</section>
</main>
<div style="flex: none; padding: 12px 20px 28px; background: #FFFDF8; border-top: 1px solid #DDD6C8">
<a href="Wishlist.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; border-radius: 14px; background: #D2451E; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 21h4"></path></svg>Save alert</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { price: 30, radius: 25, cond: 'VG+' };
  }
  renderVals() {
    const s = this.state;
    const style = (on) => ({ pressed: on ? 'true' : 'false', bg: on ? '#1B1814' : '#FFFDF8', fg: on ? '#F3EFE6' : '#1B1814', border: on ? '#1B1814' : '#CFC7B7' });
    return {
      price: String(s.price),
      radiusText: s.radius === 'Any' ? 'any distance' : s.radius + ' mi',
      condText: s.cond === 'Any' ? 'any condition' : s.cond + ' or better',
      prices: [20, 30, 40, 60, 100].map((p) => ({ ...style(p === s.price), label: String(p), pick: () => this.setState({ price: p }) })),
      radii: [10, 25, 50, 100, 'Any'].map((r) => {
        const on = r === s.radius;
        return { pressed: on ? 'true' : 'false', bg: on ? '#1B1814' : 'transparent', fg: on ? '#F3EFE6' : '#1B1814', label: r === 'Any' ? 'Any' : r + ' mi', pick: () => this.setState({ radius: r }) };
      }),
      conds: ['NM', 'VG+', 'VG', 'Any'].map((c) => ({ ...style(c === s.cond), label: c, pick: () => this.setState({ cond: c }) }))
    };
  }
}
</script>
</body>
</html>
