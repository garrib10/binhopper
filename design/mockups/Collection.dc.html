<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#B83A17}a:hover{color:#8F2C10}
button,input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3EFE6; color: #1B1814; font-family: Inter, system-ui, sans-serif; overflow: hidden">
<header style="flex: none; padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 75%; font-size: 40px; line-height: 1; text-transform: uppercase">Collection</h1>
<div style="display: flex; gap: 8px">
<a href="Profile.dc.html" aria-label="Share your collection" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #CFC7B7; color: #1B1814; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 9l5-5 5 5"></path><path d="M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"></path></svg></a>
<a href="Scan.dc.html" aria-label="Scan a record" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #CFC7B7; color: #1B1814; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M8 9v6M11 9v6M14 9v6M16.5 9v6"></path></svg></a>
<a href="Main.dc.html" aria-label="Add a record" style="width: 44px; height: 44px; border-radius: 22px; background: #1B1814; color: #F3EFE6; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="padding: 10px 12px; border-radius: 12px; background: #FFFDF8; border: 1px solid #E5DECF"><div style="font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 85%; font-size: 24px">6</div><div style="font-size: 11px; font-weight: 600; color: #6B645A">Records</div></div>
<div style="padding: 10px 12px; border-radius: 12px; background: #FFFDF8; border: 1px solid #E5DECF"><div style="font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 85%; font-size: 24px">$[VALUE]</div><div style="font-size: 11px; font-weight: 600; color: #6B645A">Est. value</div></div>
<div style="padding: 10px 12px; border-radius: 12px; background: #FFFDF8; border: 1px solid #E5DECF"><div style="font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 85%; font-size: 24px">4</div><div style="font-size: 11px; font-weight: 600; color: #6B645A">Wishlist</div></div>
</div>
<div style="display: flex; gap: 8px; overflow-x: auto">
<button type="button" aria-pressed="true" style="flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: #1B1814; color: #F3EFE6; font-size: 13px; font-weight: 600">Recently added</button>
<button type="button" aria-pressed="false" style="flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFC7B7; background: transparent; color: #1B1814; font-size: 13px; font-weight: 500">Artist A–Z</button>
<button type="button" aria-pressed="false" style="flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFC7B7; background: transparent; color: #1B1814; font-size: 13px; font-weight: 500">Genre</button>
<button type="button" aria-pressed="false" style="flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFC7B7; background: transparent; color: #1B1814; font-size: 13px; font-weight: 500">Year</button>
</div>
</header>
<main style="flex: 1; overflow-y: auto; padding: 0 20px 16px">
<a href="Holds.dc.html" style="display: flex; align-items: center; gap: 12px; margin-bottom: 10px; padding: 12px 14px; border-radius: 14px; background: #FBE3D9; color: #5A1E0B; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
<span style="flex: 1; font-size: 14px"><strong>1 hold</strong> · 1 order on the way</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
</a>
<a href="Import.dc.html" style="display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding: 12px 14px; border-radius: 14px; background: #1B1814; color: #F3EFE6; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E2B13C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Import from Discogs</span><span style="font-size: 12px; color: #D8D1C3">Collection and wantlist in one step</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
</a>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{records}}" as="r" hint-placeholder-count="6">
<a href="Owned.dc.html" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #1B1814">
<div style="aspect-ratio: 1 / 1; border-radius: 8px; background: {{r.c1}}; position: relative; overflow: hidden">
<div style="position: absolute; right: -30%; top: 12%; width: 76%; height: 76%; border-radius: 50%; background: #1B1814; display: flex; align-items: center; justify-content: center"><div style="width: 30%; height: 30%; border-radius: 50%; background: {{r.c2}}"></div></div>
<sc-if value="{{r.isNew}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; left: 8px; top: 8px; padding: 4px 8px; border-radius: 6px; background: #FFFDF8; color: #B83A17; font-size: 11px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase">Just added</span>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</div>
<div style="font-size: 12px; color: #6B645A">{{r.meta}}</div>
</div>
</a>
</sc-for>
</div>
</main>
<nav aria-label="Main" style="display: flex; flex: none; background: #FFFDF8; border-top: 1px solid #DDD6C8; padding: 4px 8px 22px">
<a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; min-height: 44px; text-decoration: none; color: #6B645A; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Search</a>
<a href="Wishlist.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; min-height: 44px; text-decoration: none; color: #6B645A; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>Wishlist</a>
<a href="Stores.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; min-height: 44px; text-decoration: none; color: #6B645A; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.3-6-11a6 6 0 0 1 12 0c0 5.7-6 11-6 11z"></path><circle cx="12" cy="10" r="2.2"></circle></svg>Nearby</a>
<a href="Collection.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; min-height: 44px; text-decoration: none; color: #B83A17; font-size: 11px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5"></circle></svg>Collection</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      records: [
        { title: 'Rumours', meta: 'Fleetwood Mac · 1977', c1: '#E2B13C', c2: '#D2451E', isNew: true },
        { title: 'Kind of Blue', meta: 'Miles Davis · 1959', c1: '#2F4F8A', c2: '#F3EFE6', isNew: false },
        { title: 'Random Access Memories', meta: 'Daft Punk · 2013', c1: '#8C8579', c2: '#F3EFE6', isNew: false },
        { title: 'Songs in the Key of Life', meta: 'Stevie Wonder · 1976', c1: '#B85C38', c2: '#E2B13C', isNew: false },
        { title: 'Remain in Light', meta: 'Talking Heads · 1980', c1: '#3E6B58', c2: '#D2451E', isNew: false },
        { title: 'Fear of Music', meta: 'Talking Heads · 1979', c1: '#4A443B', c2: '#E2B13C', isNew: false }
      ]
    };
  }
}
</script>
</body>
</html>
