<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Album, dark mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#E8B23A}a:hover{color:#F3C964}
button,input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #1E0B0F; color: #F4E9D8; font-family: Inter, system-ui, sans-serif; overflow: hidden">
<header style="flex: none; display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 0">
<a href="DarkMain.dc.html" aria-label="Back to search" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F4E9D8"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
<button type="button" aria-label="Remove Rumours from wishlist" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="#F06A4A" stroke="#F06A4A" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></button>
</header>
<main style="flex: 1; overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; gap: 16px; align-items: flex-end">
<div style="flex: none; width: 128px; height: 128px; border-radius: 8px; background: #E2B13C; position: relative; overflow: hidden; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45)">
<div style="position: absolute; right: -40px; top: 14px; width: 100px; height: 100px; border-radius: 50%; background: #0B0405; display: flex; align-items: center; justify-content: center"><div style="width: 32px; height: 32px; border-radius: 50%; background: #D2451E"></div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding-bottom: 4px">
<h1 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 75%; font-size: 36px; line-height: 0.95; text-transform: uppercase">Rumours</h1>
<a href="Artist.dc.html" style="font-size: 15px; font-weight: 700; text-decoration: none">Fleetwood Mac</a>
<div style="font-size: 12px; color: #CDB8A4">1977 · Warner Bros.</div>
</div>
</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<span style="padding: 4px 10px; border-radius: 999px; background: #3A1C22; font-size: 12px; font-weight: 600">Rock</span>
<span style="padding: 4px 10px; border-radius: 999px; background: #3A1C22; font-size: 12px; font-weight: 600">Pop Rock</span>
<span style="padding: 4px 10px; border-radius: 999px; background: #3A1C22; font-size: 12px; font-weight: 600">Soft Rock</span>
</div>
<a href="DarkStores.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 16px; border-radius: 14px; background: #E8B23A; color: #2A0F14; text-decoration: none">
<span style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 700">Find in stores</span><span style="font-size: 12px; font-weight: 500">3 within 25 mi of 10011 · from $26</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
</a>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<a href="#" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 12px; border: 1px solid #5A3440; color: #F4E9D8; font-size: 14px; font-weight: 600; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>Spotify</a>
<a href="#" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 12px; border: 1px solid #5A3440; color: #F4E9D8; font-size: 14px; font-weight: 600; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>Apple Music</a>
</div>
<div role="group" aria-label="Album details" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #2C1318">
<button type="button" aria-pressed="{{tlPressed}}" onClick="{{showTracks}}" style="min-height: 44px; border: 0; border-radius: 9px; background: {{tlBg}}; color: {{tlFg}}; font-size: 14px; font-weight: 700; cursor: pointer">Tracklist</button>
<button type="button" aria-pressed="{{prPressed}}" onClick="{{showPressings}}" style="min-height: 44px; border: 0; border-radius: 9px; background: {{prBg}}; color: {{prFg}}; font-size: 14px; font-weight: 700; cursor: pointer">Pressings (5)</button>
</div>
<sc-if value="{{isTracks}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{sides}}" as="side" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; border-radius: 14px; background: #2C1318; border: 1px solid #45232B; overflow: hidden">
<h2 style="margin: 0; padding: 10px 14px; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; background: #3A1C22; color: #E8B23A">{{side.label}}</h2>
<ol style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{side.tracks}}" as="tr" hint-placeholder-count="5">
<li style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid #45232B; font-size: 14px">
<span style="width: 26px; font-size: 12px; font-weight: 700; color: #CDB8A4">{{tr.pos}}</span>
<span style="flex: 1">{{tr.title}}</span>
</li>
</sc-for>
</ol>
</section>
</sc-for>
</div>
</sc-if>
<sc-if value="{{isPressings}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{pressings}}" as="p" hint-placeholder-count="5">
<a href="DarkStores.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #2C1318; border: 1px solid #45232B; text-decoration: none; color: #F4E9D8">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-weight: 700; font-size: 15px">{{p.name}}</div>
<div style="font-size: 12px; color: #CDB8A4">{{p.detail}}</div>
<sc-if value="{{p.isExcl}}" hint-placeholder-val="{{false}}">
<span style="align-self: flex-start; margin-top: 4px; padding: 3px 8px; border-radius: 6px; background: #E8B23A; color: #2A0F14; font-size: 11px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase">{{p.excl}}</span>
</sc-if>
</div>
<span style="flex: none; padding: 3px 8px; border-radius: 6px; background: {{p.badgeBg}}; color: {{p.badgeFg}}; font-size: 11px; font-weight: 700">{{p.badge}}</span>
</a>
</sc-for>
</div>
</sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'tracks' };
  }
  renderVals() {
    const tracks = this.state.tab === 'tracks';
    const t = (pos, title) => ({ pos: pos, title: title });
    const pressings = [
      { name: 'Original press', detail: '1977 · Warner Bros. · Used', n: 1 },
      { name: '180g reissue', detail: 'Remastered · New', n: 2 },
      { name: 'Clear vinyl', detail: 'Sold at Urban Outfitters', n: 0, excl: 'Retailer exclusive' },
      { name: 'Gold vinyl', detail: 'Sold on the official artist store', n: 0, excl: 'Artist store exclusive' },
      { name: 'Deluxe 2×LP', detail: 'Bonus tracks · New', n: 0 }
    ];
    return {
      isTracks: tracks,
      isPressings: !tracks,
      tlPressed: tracks ? 'true' : 'false',
      prPressed: tracks ? 'false' : 'true',
      tlBg: tracks ? '#F4E9D8' : 'transparent',
      tlFg: tracks ? '#2A0F14' : '#F4E9D8',
      prBg: tracks ? 'transparent' : '#F4E9D8',
      prFg: tracks ? '#F4E9D8' : '#2A0F14',
      showTracks: () => this.setState({ tab: 'tracks' }),
      showPressings: () => this.setState({ tab: 'pressings' }),
      sides: [
        { label: 'Side A', tracks: [t('A1', 'Second Hand News'), t('A2', 'Dreams'), t('A3', 'Never Going Back Again'), t('A4', 'Don’t Stop'), t('A5', 'Go Your Own Way'), t('A6', 'Songbird')] },
        { label: 'Side B', tracks: [t('B1', 'The Chain'), t('B2', 'You Make Loving Fun'), t('B3', 'I Don’t Want to Know'), t('B4', 'Oh Daddy'), t('B5', 'Gold Dust Woman')] }
      ],
      pressings: pressings.map((p) => ({
        ...p,
        isExcl: !!p.excl,
        badge: p.n > 0 ? p.n + ' nearby' : p.excl ? 'Online' : 'Not nearby',
        badgeBg: p.n > 0 ? '#1E3A2B' : '#3A1C22',
        badgeFg: p.n > 0 ? '#A8E3BC' : '#E0CFBF'
      }))
    };
  }
}
</script>
</body>
</html>
