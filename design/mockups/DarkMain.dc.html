</nav>
<div style="display: flex; gap: 8px; overflow-x: auto">
<button type="button" aria-pressed="true" style="flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: #F4E9D8; color: #2A0F14; font-size: 13px; font-weight: 600">In stock nearby</button>
<button type="button" aria-pressed="false" style="flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #5A3440; background: transparent; color: #F4E9D8; font-size: 13px; font-weight: 500">LP</button>
<button type="button" aria-pressed="false" style="flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #5A3440; background: transparent; color: #F4E9D8; font-size: 13px; font-weight: 500">New</button>

<button type="button" aria-pressed="false" style="flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #5A3440; background: transparent; color: #F4E9D8; font-size: 13px; font-weight: 500">Under $30</button>

</header>
<main style="flex: 1; overflow-y: auto; padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 10px">

<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Record Store Day is coming</span><span style="font-size: 12px">Build your list · 4 shops near you</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
</a>
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #CDB8A4">Popular near you</div>
<sc-for list="{{results}}" as="item" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 4px; padding: 10px 6px 10px 10px; border-radius: 14px; background: #2C1318; border: 1px solid #45232B">
<a href="DarkAlbum.dc.html" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #F4E9D8">
<div style="flex: none; width: 64px; height: 64px; border-radius: 6px; background: {{item.c1}}; position: relative; overflow: hidden">
<div style="position: absolute; right: -20px; top: 8px; width: 48px; height: 48px; border-radius: 50%; background: #0B0405; display: flex; align-items: center; justify-content: center"><div style="width: 16px; height: 16px; border-radius: 50%; background: {{item.c2}}"></div></div>
</div>
<div style="min-width: 0; display: flex; flex-direction: column; gap: 3px">
<div style="font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.title}}</div>
<div style="font-size: 13px; color: #CDB8A4">{{item.meta}}</div>
<sc-if value="{{item.inStock}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #9BD9B0"><span style="width: 7px; height: 7px; border-radius: 50%; background: #9BD9B0"></span>{{item.stock}}</div>
</sc-if>
<sc-if value="{{item.notNear}}" hint-placeholder-val="{{false}}">
<div style="font-size: 12px; font-weight: 600; color: #CDB8A4">{{item.stock}}</div>
</sc-if>
</div>
</a>
<button type="button" aria-label="{{item.heartLabel}}" onClick="{{item.toggle}}" style="flex: none; width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="{{item.heartFill}}" stroke="{{item.heartStroke}}" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>

<a href="DarkStores.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; min-height: 44px; text-decoration: none; color: #CDB8A4; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.3-6-11a6 6 0 0 1 12 0c0 5.7-6 11-6 11z"></path><circle cx="12" cy="10" r="2.2"></circle></svg>Nearby</a>
<a href="Collection.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; min-height: 44px; text-decoration: none; color: #CDB8A4; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5"></circle></svg>Collection</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { wished: { rumours: true } };
  }
  renderVals() {
    const data = [
      { id: 'rumours', title: 'Rumours', meta: 'Fleetwood Mac · 1977 · LP', stock: '3 stores within 25 mi · from $26', inStock: true, c1: '#E2B13C', c2: '#D2451E' },
      { id: 'kob', title: 'Kind of Blue', meta: 'Miles Davis · 1959 · LP', stock: '1 store within 25 mi · $32', inStock: true, c1: '#2F4F8A', c2: '#F3EFE6' },
      { id: 'blue', title: 'Blue', meta: 'Joni Mitchell · 1971 · LP', stock: 'Nearest copy is 38 mi away', inStock: false, c1: '#5B7FA6', c2: '#E2B13C' },
      { id: 'ram', title: 'Random Access Memories', meta: 'Daft Punk · 2013 · 2×LP', stock: '2 stores within 25 mi · from $44', inStock: true, c1: '#8C8579', c2: '#F3EFE6' },
      { id: 'blonde', title: 'Blonde', meta: 'Frank Ocean · 2016 · LP', stock: 'Not in stock nearby · 3 online', inStock: false, c1: '#C9C2B4', c2: '#D2451E' },
      { id: 'purple', title: 'Purple Rain', meta: 'Prince · 1984 · LP', stock: '4 stores within 25 mi · from $24', inStock: true, c1: '#6B3FA0', c2: '#E2B13C' }
    ];
    const wished = this.state.wished;
    return {
      results: data.map((d) => {
        const on = !!wished[d.id];
        return {
          ...d,
          notNear: !d.inStock,
          heartFill: on ? '#F06A4A' : 'none',
          heartStroke: on ? '#F06A4A' : '#F4E9D8',
          heartLabel: on ? 'Remove ' + d.title + ' from wishlist' : 'Add ' + d.title + ' to wishlist',
          toggle: () => this.setState({ wished: { ...wished, [d.id]: !on } })
        };
      })
    };
  }
}
</script>
</body>
