<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nearby stock, dark mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#E8B23A}a:hover{color:#F3C964}
button,input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #1E0B0F; color: #F4E9D8; font-family: Inter, system-ui, sans-serif; overflow: hidden">
<header style="flex: none; padding: 16px 20px 12px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<div style="flex: none; width: 44px; height: 44px; border-radius: 6px; background: #E2B13C; position: relative; overflow: hidden">
<div style="position: absolute; right: -14px; top: 6px; width: 32px; height: 32px; border-radius: 50%; background: #0B0405; display: flex; align-items: center; justify-content: center"><div style="width: 10px; height: 10px; border-radius: 50%; background: #D2451E"></div></div>
</div>
<div style="flex: 1; min-width: 0">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #CDB8A4">Looking for</div>
<div style="font-weight: 700; font-size: 16px">Rumours · Fleetwood Mac</div>
</div>
<a href="DarkMain.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 13px; font-weight: 700; text-decoration: none">Change</a>
</div>
<div style="display: flex; gap: 8px; align-items: stretch">
<label style="flex: none; width: 112px; display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 6px 12px; border-radius: 12px; background: #2C1318; border: 1.5px solid #CDB8A4">
<span style="font-size: 11px; font-weight: 600; color: #CDB8A4">ZIP code</span>
<input type="text" inputmode="numeric" value="10011" style="width: 100%; border: 0; outline: none; background: transparent; font-size: 17px; font-weight: 700; color: #F4E9D8; padding: 0">
</label>
<div role="group" aria-label="Search radius" style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #2C1318">
<sc-for list="{{radii}}" as="r" hint-placeholder-count="4">
<button type="button" aria-pressed="{{r.pressed}}" onClick="{{r.pick}}" style="min-height: 44px; border: 0; border-radius: 9px; background: {{r.bg}}; color: {{r.fg}}; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1">{{r.miles}}<span style="font-size: 10px; font-weight: 600">mi</span></button>
</sc-for>
</div>
</div>
</header>
<div style="flex: none; margin: 0 20px; height: 210px; border-radius: 16px; overflow: hidden; position: relative; background: #2A1419; border: 1px solid #45232B" role="img" aria-label="Map of stores carrying this record within {{radius}} miles">
<div aria-hidden="true" style="position: absolute; inset: 0; background-image: linear-gradient(#3A1E24 1px, transparent 1px), linear-gradient(90deg, #3A1E24 1px, transparent 1px); background-size: 28px 28px"></div>
<div aria-hidden="true" style="position: absolute; left: -10%; top: 62%; width: 120%; height: 14px; background: #2E3F4A; transform: rotate(-12deg)"></div>
<div aria-hidden="true" style="position: absolute; left: 50%; top: 52%; width: 172px; height: 172px; margin-left: -86px; margin-top: -86px; border-radius: 50%; border: 2px dashed #E8B23A; background: rgba(232, 178, 58, 0.08)"></div>
<div aria-hidden="true" style="position: absolute; left: 50%; top: 52%; width: 16px; height: 16px; margin-left: -8px; margin-top: -8px; border-radius: 50%; background: #F4E9D8; border: 3px solid #2A1419; box-sizing: border-box"></div>
<sc-for list="{{list}}" as="p" hint-placeholder-count="3">
<div aria-hidden="true" style="position: absolute; left: {{p.left}}; top: {{p.top}}; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center">
<div style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #E8B23A; color: #2A0F14; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{p.n}}</div>
<div style="width: 2px; height: 6px; background: #E8B23A"></div>
</div>
</sc-for>
<div style="position: absolute; left: 10px; bottom: 10px; padding: 5px 10px; border-radius: 999px; background: #2C1318; font-size: 12px; font-weight: 700">{{radius}} mi radius</div>
</div>
<main style="flex: 1; overflow-y: auto; padding: 14px 20px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h1 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 75%; font-size: 26px; text-transform: uppercase">{{countLabel}}</h1>
<span style="font-size: 12px; font-weight: 600; color: #CDB8A4">Sorted by distance</span>
</div>
<sc-for list="{{list}}" as="s" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #2C1318; border: 1px solid #45232B">
<div style="display: flex; align-items: flex-start; gap: 12px">
<div style="flex: none; width: 26px; height: 26px; border-radius: 13px; background: #E8B23A; color: #2A0F14; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{s.n}}</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<a href="Store.dc.html" style="font-weight: 700; font-size: 15px; color: #F4E9D8">{{s.name}}</a>
<div style="font-size: 12px; color: #CDB8A4">{{s.mi}} mi · {{s.area}}</div>
<div style="display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap">
<span style="padding: 3px 8px; border-radius: 6px; background: #1E3A2B; color: #A8E3BC; font-size: 11px; font-weight: 700">{{s.qty}}</span>
<span style="padding: 3px 8px; border-radius: 6px; background: #3A1C22; color: #E0CFBF; font-size: 11px; font-weight: 600">{{s.cond}}</span>
</div>
</div>
<div style="font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 85%; font-size: 22px">{{s.price}}</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<a href="Record.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border-radius: 10px; border: 1px solid #5A3440; color: #F4E9D8; font-size: 13px; font-weight: 600; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8z"></path></svg>Locate</a>
<a href="Record.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border-radius: 10px; background: #E8B23A; color: #2A0F14; font-size: 13px; font-weight: 700; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>Buy / hold</a>
</div>
</div>
</sc-for>
</main>
<nav aria-label="Main" style="display: flex; flex: none; background: #2C1318; border-top: 1px solid #45232B; padding: 4px 8px 22px">
<a href="DarkMain.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; min-height: 44px; text-decoration: none; color: #CDB8A4; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Search</a>
<a href="Wishlist.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; min-height: 44px; text-decoration: none; color: #CDB8A4; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>Wishlist</a>
<a href="DarkStores.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; min-height: 44px; text-decoration: none; color: #E8B23A; font-size: 11px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.3-6-11a6 6 0 0 1 12 0c0 5.7-6 11-6 11z"></path><circle cx="12" cy="10" r="2.2"></circle></svg>Nearby</a>
<a href="Collection.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; min-height: 44px; text-decoration: none; color: #CDB8A4; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5"></circle></svg>Collection</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { radius: 25 };
  }
  renderVals() {
    const radius = this.state.radius;
    const stores = [
      { name: 'Spin Cycle Records', mi: 3.2, area: 'Chelsea', price: '$26', cond: 'New · 180g', qty: '2 in stock', a: -40 },
      { name: 'Second Pressing', mi: 8.7, area: 'Williamsburg', price: '$18', cond: 'Used · VG+', qty: '1 in stock', a: 25 },
      { name: 'Groove Merchant', mi: 21.4, area: 'Montclair, NJ', price: '$28', cond: 'New', qty: '3 in stock', a: 200 },
      { name: 'Dead Wax Exchange', mi: 44, area: 'White Plains', price: '$22', cond: 'Used · NM', qty: '1 in stock', a: -80 },
      { name: 'Long Player Co.', mi: 82, area: 'New Haven, CT', price: '$27', cond: 'New', qty: '2 in stock', a: -55 }
    ];
    const ringPx = 86;
    const list = stores.filter((s) => s.mi <= radius).map((s, i) => {
      const r = (s.mi / radius) * ringPx;
      const rad = (s.a * Math.PI) / 180;
      return {
        ...s,
        n: String(i + 1),
        left: 'calc(50% + ' + Math.round(Math.cos(rad) * r) + 'px)',
        top: 'calc(52% + ' + Math.round(Math.sin(rad) * r) + 'px)'
      };
    });
    return {
      radius: String(radius),
      countLabel: list.length + (list.length === 1 ? ' store has it' : ' stores have it'),
      list: list,
      radii: [10, 25, 50, 100].map((m) => ({
        miles: String(m),
        pressed: m === radius ? 'true' : 'false',
        bg: m === radius ? '#F4E9D8' : 'transparent',
        fg: m === radius ? '#2A0F14' : '#F4E9D8',
        pick: () => this.setState({ radius: m })
      }))
    };
  }
}
</script>
</body>
</html>
