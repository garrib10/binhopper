<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#B83A17}a:hover{color:#8F2C10}
button,input{font:inherit}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; box-sizing: border-box; background: #F3EFE6; color: #1B1814; font-family: Inter, system-ui, sans-serif">
<header style="background: #FFFDF8; border-bottom: 1px solid #DDD6C8">
<div style="max-width: 1360px; margin: 0 auto; padding: 14px 2rem; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px">
<div style="display: flex; align-items: center; gap: 8px; font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 75%; font-size: 24px; letter-spacing: 0.02em; text-transform: uppercase"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D2451E" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5"></circle></svg>Spindle</div>
<label style="flex: 1 1 320px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 12px; background: #F3EFE6; border: 1.5px solid #1B1814">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1814" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search records</span>
<input type="search" placeholder="Artist, album, label, catalog number…" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 15px; color: #1B1814">
</label>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px">
<a href="#" aria-current="page" style="min-height: 44px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; background: #1B1814; color: #F3EFE6; font-size: 14px; font-weight: 700; text-decoration: none">Search</a>
<a href="#" style="min-height: 44px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; color: #4A443B; font-size: 14px; font-weight: 600; text-decoration: none">Wishlist</a>
<a href="Desktop.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; color: #4A443B; font-size: 14px; font-weight: 600; text-decoration: none">Nearby</a>
<a href="DesktopCollection.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; color: #4A443B; font-size: 14px; font-weight: 600; text-decoration: none">Collection</a>
</nav>
<a href="DesktopYou.dc.html" aria-label="You: account and settings" style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: #E2B13C; color: #1B1814; display: flex; align-items: center; justify-content: center; font-family: Archivo, sans-serif; font-weight: 800; font-size: 15px; text-decoration: none">JR</a>
</div>
</header>
<div style="max-width: 1360px; margin: 0 auto; padding: 28px 2rem 40px; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">
<aside aria-label="Filters" style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 20px">
<div role="group" aria-label="Search by" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #E5DECF">
<button type="button" aria-pressed="true" style="min-height: 40px; border: 0; border-radius: 9px; background: #1B1814; color: #F3EFE6; font-size: 13px; font-weight: 700">Albums</button>
<button type="button" aria-pressed="false" style="min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: #1B1814; font-size: 13px; font-weight: 600">Artists</button>
<button type="button" aria-pressed="false" style="min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: #1B1814; font-size: 13px; font-weight: 600">Labels</button>
</div>
<label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 12px; background: #FFFDF8; border: 1px solid #E5DECF">
<span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">In stock near me</span><span style="font-size: 12px; color: #6B645A">25 mi of 10011</span></span>
<input type="checkbox" checked="{{nearOnly}}" onChange="{{toggleNear}}" style="width: 22px; height: 22px; accent-color: #1B1814">
</label>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B645A">Genre</legend>
<sc-for list="{{genres}}" as="g" hint-placeholder-count="6">
<label style="display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 14px"><input type="checkbox" checked="{{g.on}}" style="width: 18px; height: 18px; accent-color: #1B1814">{{g.name}}</label>
</sc-for>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0">
<legend style="padding: 0; margin-bottom: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B645A">Decade</legend>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{decades}}" as="d" hint-placeholder-count="7">
<button type="button" aria-pressed="{{d.pressed}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; font-size: 13px; font-weight: 600">{{d.label}}</button>
</sc-for>
</div>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B645A">Condition</legend>
<label style="display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 14px"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #1B1814">New</label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 14px"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #1B1814">Used VG+ or better</label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 14px"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #1B1814">Used, any grade</label>
</fieldset>
</aside>
<main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
<div><h1 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 75%; font-size: 44px; line-height: 1; text-transform: uppercase">Rock · 1970s</h1><div style="font-size: 14px; color: #6B645A; margin-top: 4px">{{summary}}</div></div>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">Sort
<select style="min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #CFC7B7; background: #FFFDF8; font: inherit"><option>Most popular</option><option>Nearest</option><option>Lowest price</option><option>Year</option></select>
</label>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 18px">
<sc-for list="{{records}}" as="r" hint-placeholder-count="8">
<div style="display: flex; flex-direction: column; gap: 8px">
<a href="DesktopAlbum.dc.html" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #1B1814">
<div style="aspect-ratio: 1 / 1; border-radius: 8px; background: {{r.c1}}; position: relative; overflow: hidden">
<div style="position: absolute; right: -30%; top: 12%; width: 76%; height: 76%; border-radius: 50%; background: #1B1814; display: flex; align-items: center; justify-content: center"><div style="width: 30%; height: 30%; border-radius: 50%; background: {{r.c2}}"></div></div>
<span style="position: absolute; left: 8px; bottom: 8px; padding: 3px 8px; border-radius: 6px; background: {{r.badgeBg}}; color: {{r.badgeFg}}; font-size: 11px; font-weight: 700">{{r.badge}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span><span style="font-size: 13px; color: #6B645A">{{r.artist}} · {{r.year}}</span></div>
</a>
</div>
</sc-for>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { nearOnly: false };
  }
  renderVals() {
    const near = this.state.nearOnly;
    const data = [
      { title: 'Rumours', artist: 'Fleetwood Mac', year: '1977', n: 3, c1: '#E2B13C', c2: '#D2451E' },
      { title: 'Aja', artist: 'Steely Dan', year: '1977', n: 4, c1: '#2B2620', c2: '#E2B13C' },
      { title: 'Horses', artist: 'Patti Smith', year: '1975', n: 1, c1: '#C9C2B4', c2: '#1B1814' },
      { title: 'Born to Run', artist: 'Bruce Springsteen', year: '1975', n: 2, c1: '#B85C38', c2: '#F3EFE6' },
      { title: 'Marquee Moon', artist: 'Television', year: '1977', n: 0, c1: '#C9C2B4', c2: '#2F4F8A' },
      { title: 'Exile on Main St.', artist: 'The Rolling Stones', year: '1972', n: 1, c1: '#4A443B', c2: '#E2B13C' },
      { title: 'Low', artist: 'David Bowie', year: '1977', n: 2, c1: '#D97A3A', c2: '#F3EFE6' },
      { title: 'Bat Out of Hell', artist: 'Meat Loaf', year: '1977', n: 0, c1: '#7A6A4F', c2: '#1B1814' }
    ];
    const shown = near ? data.filter((d) => d.n > 0) : data;
    return {
      nearOnly: near,
      toggleNear: () => this.setState({ nearOnly: !near }),
      summary: shown.length + (near ? ' vinyl albums in stock near you' : ' vinyl albums') + ' · sample results',
      genres: [['Rock', true], ['Jazz', false], ['Soul & Funk', false], ['Electronic', false], ['Folk', false], ['Hip-Hop', false]].map(([name, on]) => ({ name: name, on: on })),
      decades: ['60s', '70s', '80s', '90s', '00s', '10s', '20s'].map((l) => {
        const on = l === '70s';
        return { label: l, pressed: on ? 'true' : 'false', bg: on ? '#1B1814' : 'transparent', fg: on ? '#F3EFE6' : '#1B1814', border: on ? '#1B1814' : '#CFC7B7' };
      }),
      records: shown.map((d) => ({
        ...d,
        badge: d.n > 0 ? d.n + ' nearby' : 'Not nearby',
        badgeBg: d.n > 0 ? '#DCEBDF' : '#FFFDF8',
        badgeFg: d.n > 0 ? '#1F5A3E' : '#4A443B'
      }))
    };
  }
}
</script>
</body>
</html>
