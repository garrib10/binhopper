<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse by genre and year</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#B83A17}a:hover{color:#8F2C10}
button,input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3EFE6; color: #1B1814; font-family: Inter, system-ui, sans-serif; overflow: hidden">
<header style="flex: none; padding: 12px 20px 10px; display: flex; flex-direction: column; gap: 10px">
<a href="Main.dc.html" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; gap: 4px; color: #1B1814; font-size: 14px; font-weight: 600; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>Search</a>
<h1 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 75%; font-size: 40px; line-height: 1; text-transform: uppercase">Browse</h1>
</header>
<main style="flex: 1; overflow-y: auto; padding: 0 20px 16px; display: flex; flex-direction: column; gap: 18px">
<section aria-labelledby="g-h" style="display: flex; flex-direction: column; gap: 10px">
<h2 id="g-h" style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B645A">1 · Genre</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{genres}}" as="g" hint-placeholder-count="8">
<button type="button" aria-pressed="{{g.pressed}}" onClick="{{g.pick}}" style="position: relative; overflow: hidden; height: 64px; padding: 0 14px; border-radius: 12px; border: {{g.border}}; background: {{g.c}}; color: {{g.fg}}; font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 80%; font-size: 19px; text-transform: uppercase; text-align: left; cursor: pointer">{{g.name}}<span aria-hidden="true" style="position: absolute; right: -18px; bottom: -18px; width: 56px; height: 56px; border-radius: 50%; background: rgba(27, 24, 20, 0.18)"></span></button>
</sc-for>
</div>
</section>
<section aria-labelledby="d-h" style="display: flex; flex-direction: column; gap: 10px">
<h2 id="d-h" style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B645A">2 · Decade</h2>
<div style="display: flex; gap: 6px; overflow-x: auto">
<sc-for list="{{decades}}" as="d" hint-placeholder-count="7">
<button type="button" aria-pressed="{{d.pressed}}" onClick="{{d.pick}}" style="flex: none; min-width: 56px; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; font-size: 13px; font-weight: 700; cursor: pointer">{{d.label}}</button>
</sc-for>
</div>
</section>
<section aria-labelledby="y-h" style="display: flex; flex-direction: column; gap: 10px">
<h2 id="y-h" style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B645A">3 · Year (optional)</h2>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{years}}" as="y" hint-placeholder-count="10">
<button type="button" aria-pressed="{{y.pressed}}" onClick="{{y.pick}}" style="min-height: 44px; border-radius: 10px; border: 1px solid {{y.border}}; background: {{y.bg}}; color: {{y.fg}}; font-size: 14px; font-weight: 700; cursor: pointer">{{y.label}}</button>
</sc-for>
</div>
</section>
</main>
<div style="flex: none; padding: 12px 20px 28px; background: #FFFDF8; border-top: 1px solid #DDD6C8">
<a href="Years.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; border-radius: 14px; background: #D2451E; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">{{cta}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { genre: 'Rock', decade: 1970, year: 1977 };
  }
  renderVals() {
    const s = this.state;
    const genres = [
      { name: 'Rock', c: '#D2451E', fg: '#FFFFFF' },
      { name: 'Jazz', c: '#2F4F8A', fg: '#FFFFFF' },
      { name: 'Soul & Funk', c: '#E2B13C', fg: '#1B1814' },
      { name: 'Hip-Hop', c: '#1B1814', fg: '#F3EFE6' },
      { name: 'Electronic', c: '#3E6B58', fg: '#FFFFFF' },
      { name: 'Folk', c: '#B5A27A', fg: '#1B1814' },
      { name: 'Reggae', c: '#6B8F3A', fg: '#FFFFFF' },
      { name: 'Classical', c: '#6B3FA0', fg: '#FFFFFF' }
    ];
    const pill = (on) => ({ bg: on ? '#1B1814' : 'transparent', fg: on ? '#F3EFE6' : '#1B1814', border: on ? '#1B1814' : '#CFC7B7', pressed: on ? 'true' : 'false' });
    const years = [];
    for (let y = s.decade; y < s.decade + 10; y++) years.push(y);
    const when = s.year ? String(s.year) : 'the ' + s.decade + 's';
    return {
      genres: genres.map((g) => {
        const on = g.name === s.genre;
        return { ...g, pressed: on ? 'true' : 'false', border: on ? '3px solid #1B1814' : '3px solid transparent', pick: () => this.setState({ genre: g.name }) };
      }),
      decades: [1960, 1970, 1980, 1990, 2000, 2010, 2020].map((d) => ({
        ...pill(d === s.decade),
        label: "’" + String(d).slice(2) + 's',
        pick: () => this.setState({ decade: d, year: null })
      })),
      years: years.map((y) => ({
        ...pill(y === s.year),
        label: "’" + String(y).slice(2),
        pick: () => this.setState({ year: y === s.year ? null : y })
      })),
      cta: 'Show ' + s.genre + ' from ' + when
    };
  }
}
</script>
</body>
</html>
