<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#B83A17}a:hover{color:#8F2C10}
button,input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3EFE6; color: #1B1814; font-family: Inter, system-ui, sans-serif; overflow: hidden">
<header style="flex: none; padding: 12px 20px 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; gap: 4px; color: #1B1814; font-size: 14px; font-weight: 600; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>Search</a>
<a href="NotifySettings.dc.html" aria-label="Notification settings" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #CFC7B7; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #1B1814"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></a>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h1 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 75%; font-size: 40px; line-height: 1; text-transform: uppercase">Notifications</h1>
</div>
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 13px; font-weight: 600; color: #6B645A">{{unreadLabel}}</span>
<button type="button" onClick="{{markAll}}" style="min-height: 44px; padding: 0; border: 0; background: transparent; color: #B83A17; font-size: 13px; font-weight: 700; cursor: pointer">Mark all read</button>
</div>
</header>
<main style="flex: 1; overflow-y: auto; padding: 0 20px 20px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{items}}" as="n" hint-placeholder-count="6">
<a href="{{n.href}}" style="display: flex; gap: 12px; padding: 12px 14px; border-radius: 14px; background: {{n.bg}}; border: 1px solid #E5DECF; text-decoration: none; color: #1B1814">
<div style="flex: none; width: 36px; height: 36px; border-radius: 18px; background: {{n.iconBg}}; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: {{n.iconFg}}">{{n.tag}}</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 14px; font-weight: 700">{{n.title}}</div>
<div style="font-size: 13px; color: #4A443B; line-height: 1.4">{{n.body}}</div>
<div style="font-size: 11px; color: #6B645A">{{n.when}}</div>
</div>
</a>
</sc-for>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { allRead: false };
  }
  renderVals() {
    const items = [
      { tag: 'IN', title: 'Blue is in stock nearby', body: 'Second Pressing · 8.7 mi · $29 · New', when: '12 min ago', href: 'Stores.dc.html', unread: true },
      { tag: '$', title: 'Price drop on Purple Rain', body: 'Spin Cycle Records dropped it to $22, under your $30 alert', when: '1 hr ago', href: 'Stores.dc.html', unread: true },
      { tag: 'HD', title: 'Your hold ends tomorrow', body: 'Rumours at Spin Cycle Records · held until Fri 6 pm', when: '3 hr ago', href: 'Holds.dc.html', unread: true },
      { tag: 'NEW', title: 'Spin Cycle Records: 14 new arrivals', body: '2 match your genres · 1 on your wishlist', when: 'Yesterday', href: 'Store.dc.html', unread: false },
      { tag: 'RSD', title: 'RSD allocations posted', body: 'Spin Cycle Records expects 2 of your picks', when: '2 days ago', href: 'RSD.dc.html', unread: false },
      { tag: '?', title: 'Was Kind of Blue on the shelf?', body: 'Help other diggers: confirm stock at Second Pressing', when: '3 days ago', href: 'Report.dc.html', unread: false }
    ];
    const allRead = this.state.allRead;
    const unread = allRead ? 0 : items.filter((n) => n.unread).length;
    return {
      unreadLabel: unread > 0 ? unread + ' new' : 'All caught up',
      markAll: () => this.setState({ allRead: true }),
      items: items.map((n) => {
        const u = n.unread && !allRead;
        return { ...n, bg: u ? '#FFFDF8' : 'transparent', iconBg: u ? '#D2451E' : '#E5DECF', iconFg: u ? '#FFFFFF' : '#4A443B' };
      })
    };
  }
}
</script>
</body>
</html>
