<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notification settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#B83A17}a:hover{color:#8F2C10}
button,input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3EFE6; color: #1B1814; font-family: Inter, system-ui, sans-serif; overflow: hidden">
<header style="flex: none; padding: 12px 20px 12px; display: flex; flex-direction: column; gap: 8px">
<a href="You.dc.html" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; gap: 4px; color: #1B1814; font-size: 14px; font-weight: 600; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>You</a>
<h1 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 75%; font-size: 36px; line-height: 1; text-transform: uppercase">Notification settings</h1>
</header>
<main style="flex: 1; overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 18px">
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B645A">How often</legend>
<sc-for list="{{freq}}" as="f" hint-placeholder-count="3">
<button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; border-radius: 12px; border: {{f.border}}; background: #FFFDF8; text-align: left; color: #1B1814; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #1B1814; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{f.dot}}"></span></span>
<span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">{{f.label}}</span><span style="font-size: 12px; color: #6B645A">{{f.note}}</span></span>
</button>
</sc-for>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B645A">Notify me about</legend>
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="5">
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 12px; background: #FFFDF8; border: 1px solid #E5DECF">
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 600">{{k.label}}</span><span style="font-size: 12px; color: #6B645A">{{k.note}}</span></span>
<input type="checkbox" checked="{{k.on}}" onChange="{{k.toggle}}" style="width: 22px; height: 22px; accent-color: #1B1814">
</label>
</sc-for>
</fieldset>
<label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-radius: 12px; background: #FFFDF8; border: 1px solid #E5DECF">
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 600">Quiet hours</span><span style="font-size: 12px; color: #6B645A">10 pm – 8 am · alerts wait until morning</span></span>
<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #1B1814">
</label>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { freq: 'instant', kinds: { stock: true, price: true, store: true, hold: true, rsd: false } };
  }
  renderVals() {
    const s = this.state;
    const freqs = [
      { k: 'instant', label: 'Instantly', note: 'Best for in-demand records' },
      { k: 'digest', label: 'Daily digest', note: 'One summary each evening' },
      { k: 'weekly', label: 'Weekly', note: 'Sunday roundup' }
    ];
    const kinds = [
      { k: 'stock', label: 'Wishlist in stock', note: 'Within your radius' },
      { k: 'price', label: 'Price drops', note: 'Below your alert price' },
      { k: 'store', label: 'Followed stores', note: 'New arrivals' },
      { k: 'hold', label: 'Holds & orders', note: 'Reminders and shipping' },
      { k: 'rsd', label: 'Record Store Day', note: 'Lists and allocations' }
    ];
    return {
      freq: freqs.map((f) => ({
        ...f,
        pressed: f.k === s.freq ? 'true' : 'false',
        dot: f.k === s.freq ? '#1B1814' : 'transparent',
        border: f.k === s.freq ? '2px solid #1B1814' : '1px solid #E5DECF',
        pick: () => this.setState({ freq: f.k })
      })),
      kinds: kinds.map((k) => ({ ...k, on: !!s.kinds[k.k], toggle: () => this.setState({ kinds: { ...s.kinds, [k.k]: !s.kinds[k.k] } }) }))
    };
  }
}
</script>
</body>
</html>
