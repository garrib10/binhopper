<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rock records from 1977</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#B83A17}a:hover{color:#8F2C10}
button,input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3EFE6; color: #1B1814; font-family: Inter, system-ui, sans-serif; overflow: hidden">
<header style="flex: none; padding: 12px 20px 12px; display: flex; flex-direction: column; gap: 10px">
<a href="Genre.dc.html" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; gap: 4px; color: #1B1814; font-size: 14px; font-weight: 600; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>Browse</a>
<div style="display: flex; align-items: baseline; gap: 10px">
<h1 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 75%; font-size: 40px; line-height: 1; text-transform: uppercase">Rock · 1977</h1>
</div>
<div style="font-size: 13px; color: #6B645A">{{summary}}</div>
<div role="group" aria-label="Sort" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #E5DECF">
<button type="button" aria-pressed="{{popPressed}}" onClick="{{byPopular}}" style="min-height: 44px; border: 0; border-radius: 9px; background: {{popBg}}; color: {{popFg}}; font-size: 14px; font-weight: 700; cursor: pointer">Most popular</button>
<button type="button" aria-pressed="{{nearPressed}}" onClick="{{byNear}}" style="min-height: 44px; border: 0; border-radius: 9px; background: {{nearBg}}; color: {{nearFg}}; font-size: 14px; font-weight: 700; cursor: pointer">In stock near me</button>
</div>
</header>
<main style="flex: 1; overflow-y: auto; padding: 0 20px 20px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{records}}" as="r" hint-placeholder-count="6">
<a href="Album.dc.html" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #1B1814">
<div style="aspect-ratio: 1 / 1; border-radius: 8px; background: {{r.c1}}; position: relative; overflow: hidden">
<div style="position: absolute; right: -30%; top: 12%; width: 76%; height: 76%; border-radius: 50%; background: #1B1814; display: flex; align-items: center; justify-content: center"><div style="width: 30%; height: 30%; border-radius: 50%; background: {{r.c2}}"></div></div>
<span style="position: absolute; left: 8px; bottom: 8px; padding: 3px 8px; border-radius: 6px; background: {{r.badgeBg}}; color: {{r.badgeFg}}; font-size: 11px; font-weight: 700">{{r.badge}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</div>
<div style="font-size: 12px; color: #6B645A">{{r.artist}}</div>
</div>
</a>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sort: 'popular' };
  }
  renderVals() {
    const popular = this.state.sort === 'popular';
    const data = [
      { title: 'Rumours', artist: 'Fleetwood Mac', n: 3, c1: '#E2B13C', c2: '#D2451E' },
      { title: 'News of the World', artist: 'Queen', n: 2, c1: '#8C8579', c2: '#E2B13C' },
      { title: 'Animals', artist: 'Pink Floyd', n: 1, c1: '#4A443B', c2: '#F3EFE6' },
      { title: 'Bat Out of Hell', artist: 'Meat Loaf', n: 0, c1: '#B85C38', c2: '#1B1814' },
      { title: 'Never Mind the Bollocks', artist: 'Sex Pistols', n: 1, c1: '#E2D23C', c2: '#D2451E' },
      { title: 'Aja', artist: 'Steely Dan', n: 4, c1: '#2B2620', c2: '#E2B13C' },
      { title: 'Marquee Moon', artist: 'Television', n: 0, c1: '#C9C2B4', c2: '#2F4F8A' },
      { title: 'Low', artist: 'David Bowie', n: 2, c1: '#D97A3A', c2: '#F3EFE6' }
    ];
    const shown = popular ? data : data.filter((d) => d.n > 0).sort((a, b) => b.n - a.n);
    return {
      summary: popular ? data.length + ' vinyl albums · sorted by popularity' : shown.length + ' albums in stock within 25 mi of 10011',
      popPressed: popular ? 'true' : 'false',
      nearPressed: popular ? 'false' : 'true',
      popBg: popular ? '#1B1814' : 'transparent',
      popFg: popular ? '#F3EFE6' : '#1B1814',
      nearBg: popular ? 'transparent' : '#1B1814',
      nearFg: popular ? '#1B1814' : '#F3EFE6',
      byPopular: () => this.setState({ sort: 'popular' }),
      byNear: () => this.setState({ sort: 'near' }),
      records: shown.map((d) => ({
        ...d,
        badge: d.n > 0 ? d.n + ' nearby' : 'Not nearby',
        badgeBg: d.n > 0 ? '#DCEBDF' : '#FFFDF8',
        badgeFg: d.n > 0 ? '#1F5A3E' : '#4A443B'
      }))
    };
  }
}
</script>
</body>
</html>
