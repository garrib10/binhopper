# Local MySQL for development: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: binhopper
      MYSQL_USER: binhopper
      MYSQL_PASSWORD: binhopper
      MYSQL_ROOT_PASSWORD: binhopper-root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20

volumes:
  mysql-data:
